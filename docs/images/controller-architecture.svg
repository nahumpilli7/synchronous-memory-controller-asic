<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="820" viewBox="0 0 1750 820" role="img" aria-labelledby="title desc">
  <title id="title">Synchronous memory controller hardware architecture</title>
  <desc id="desc">Hardware block diagram with a four-state control FSM and wait counter above a straight request-register, address-decode, memory-array, and read-response datapath.</desc>
  <defs>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6575; }
      .coreLabel { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.08em; fill: #475569; }
      .blockTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .signal { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #243047; }
      .mono { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .note { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .edgeLabel { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526074; }
      .state { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f5f59; }
      .data { fill: none; stroke: #2563eb; stroke-width: 3.2; marker-end: url(#dataArrow); }
      .control { fill: none; stroke: #0f766e; stroke-width: 2.2; marker-end: url(#controlArrow); }
      .global { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#globalArrow); }
    </style>
    <marker id="dataArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="controlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="globalArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1750" height="820" fill="#ffffff"/>
  <text x="875" y="42" text-anchor="middle" class="title">Synchronous Memory Controller</text>
  <text x="875" y="68" text-anchor="middle" class="subtitle">RTL architecture • one blocking request • 8 × 32-bit register memory • three configured wait cycles</text>

  <rect x="280" y="100" width="1110" height="620" rx="8" fill="#fafbfc" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="305" y="128" class="coreLabel">MEM_CONTROLLER</text>

  <text x="44" y="183" class="signal">req_valid</text>
  <path d="M150 178 H420" class="control"/>
  <text x="44" y="444" class="signal">req_rw</text>
  <path d="M132 439 H360" class="data"/>
  <text x="44" y="504" class="signal">req_addr[31:0]</text>
  <path d="M208 499 H360" class="data"/>
  <text x="44" y="564" class="signal">req_wdata[31:0]</text>
  <path d="M218 559 H360" class="data"/>

  <rect x="420" y="145" width="390" height="155" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="420" y="145" width="390" height="7" fill="#0f766e"/>
  <text x="615" y="183" text-anchor="middle" class="blockTitle">Controller FSM</text>
  <text x="615" y="225" text-anchor="middle" class="state">IDLE  →  LATCH  →  WAIT  →  RESPOND  →  IDLE</text>
  <text x="615" y="259" text-anchor="middle" class="note">accept  •  capture  •  delay  •  response</text>

  <rect x="930" y="155" width="230" height="120" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="930" y="155" width="230" height="7" fill="#0f766e"/>
  <text x="1045" y="195" text-anchor="middle" class="blockTitle">Wait Counter</text>
  <text x="1045" y="225" text-anchor="middle" class="mono">wait_q: 3 → 2 → 1 → 0</text>
  <text x="1045" y="251" text-anchor="middle" class="note">LATENCY_CYCLES = 3</text>

  <path d="M810 190 H930" class="control"/>
  <text x="870" y="180" text-anchor="middle" class="edgeLabel">load / decrement</text>
  <path d="M930 247 H870 V270 H810" class="control"/>
  <text x="857" y="258" text-anchor="end" class="edgeLabel">done</text>

  <rect x="360" y="390" width="255" height="210" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="360" y="390" width="255" height="7" fill="#2563eb"/>
  <text x="487.5" y="430" text-anchor="middle" class="blockTitle">Request Registers</text>
  <text x="387" y="472" class="mono">lat_rw_q</text>
  <text x="387" y="514" class="mono">lat_addr_q[31:0]</text>
  <text x="387" y="556" class="mono">lat_wdata_q[31:0]</text>
  <text x="487.5" y="582" text-anchor="middle" class="note">captured in S_LATCH</text>

  <rect x="690" y="515" width="180" height="85" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="690" y="515" width="180" height="7" fill="#2563eb"/>
  <text x="780" y="550" text-anchor="middle" class="blockTitle">Word Index</text>
  <text x="780" y="580" text-anchor="middle" class="mono">addr[4:2]</text>

  <rect x="950" y="390" width="230" height="210" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="950" y="390" width="230" height="7" fill="#2563eb"/>
  <text x="1065" y="430" text-anchor="middle" class="blockTitle">Register Memory</text>
  <text x="1065" y="472" text-anchor="middle" class="mono">mem[0:7]</text>
  <text x="1065" y="510" text-anchor="middle" class="mono">8 × 32 bits</text>
  <text x="1065" y="550" text-anchor="middle" class="note">read or write at indexed word</text>
  <text x="1065" y="576" text-anchor="middle" class="note">operation commits in S_RESPOND</text>

  <rect x="1230" y="445" width="135" height="105" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="1230" y="445" width="135" height="7" fill="#2563eb"/>
  <text x="1297.5" y="481" text-anchor="middle" class="blockTitle">Read Data</text>
  <text x="1297.5" y="516" text-anchor="middle" class="mono">resp_rdata_q</text>

  <path d="M615 550 H690" class="data"/>
  <text x="652" y="540" text-anchor="middle" class="edgeLabel">lat_addr_q</text>
  <path d="M870 550 H950" class="data"/>
  <text x="910" y="540" text-anchor="middle" class="edgeLabel">idx[2:0]</text>
  <path d="M615 500 H950" class="data"/>
  <text x="780" y="490" text-anchor="middle" class="edgeLabel">lat_wdata_q[31:0]</text>
  <path d="M615 450 H950" class="data"/>
  <text x="780" y="440" text-anchor="middle" class="edgeLabel">lat_rw_q</text>
  <path d="M1180 499 H1230" class="data"/>
  <text x="1205" y="489" text-anchor="middle" class="edgeLabel">read data</text>

  <path d="M520 300 V390" class="control"/>
  <text x="530" y="350" class="edgeLabel">capture</text>
  <path d="M700 300 V345 H1065 V390" class="control"/>
  <text x="880" y="335" text-anchor="middle" class="edgeLabel">memory access / R/W</text>

  <path d="M810 270 H850 V320 H1425 V240 H1510" class="control"/>
  <text x="1440" y="228" class="edgeLabel">one-cycle pulse</text>
  <text x="1525" y="245" class="signal">resp_ready</text>
  <path d="M1365 499 H1510" class="data"/>
  <text x="1525" y="504" class="signal">resp_rdata[31:0]</text>

  <text x="44" y="657" class="signal">clk</text>
  <path d="M86 652 H320" class="global"/>
  <text x="44" y="700" class="signal">rst_n</text>
  <path d="M96 695 H320" class="global"/>
  <text x="340" y="662" class="note">Clock drives FSM, counter, request registers, memory writes, and response register</text>
  <text x="340" y="701" class="note">Active-low asynchronous reset clears control/datapath registers; memory contents are not reset</text>

  <line x1="515" y1="770" x2="565" y2="770" stroke="#0f766e" stroke-width="2.2"/>
  <text x="577" y="775" class="note">control</text>
  <line x1="685" y1="770" x2="735" y2="770" stroke="#2563eb" stroke-width="3.2"/>
  <text x="747" y="775" class="note">data bus</text>
  <text x="875" y="775" class="note">Default physical implementation: ADDR_W=5, DEPTH_WORDS=8, LATENCY_CYCLES=3</text>
</svg>
