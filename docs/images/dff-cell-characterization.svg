<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Custom DFF cell characterization</title>
  <desc id="desc">Four-panel engineering summary showing transistor-level layout, clean Calibre LVS, parasitic-extracted HSPICE timing, and a setup-time sweep for the custom falling-edge D flip-flop.</desc>
  <defs>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b6575; }
      .panelNo { font: 800 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .panelTitle { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .panelSub { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .value { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #111827; }
      .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .darkLabel { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #dbeafe; }
      .status { font: 800 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #047857; letter-spacing: 0.04em; }
      .pass { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #047857; }
      .fail { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b91c1c; }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="headerGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="8" fill="url(#headerGlow)"/>
  <text x="800" y="54" text-anchor="middle" class="title">Custom DFF Cell Characterization</text>
  <text x="800" y="84" text-anchor="middle" class="subtitle">Falling-edge storage cell • layout → LVS → PEX timing → setup-time boundary</text>

  <!-- Panel A: layout -->
  <g filter="url(#shadow)">
    <rect x="50" y="120" width="730" height="380" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="50" y="120" width="730" height="6" rx="3" fill="#2563eb"/>
  </g>
  <circle cx="86" cy="163" r="16" fill="#2563eb"/>
  <text x="86" y="168" text-anchor="middle" class="panelNo">A</text>
  <text x="116" y="160" class="panelTitle">Transistor-level layout</text>
  <text x="116" y="182" class="panelSub">Custom falling-edge DFF in the academic 65 nm flow</text>
  <rect x="76" y="208" width="678" height="250" rx="6" fill="#07111f"/>
  <rect x="76" y="208" width="678" height="250" rx="6" fill="url(#grid)"/>

  <!-- abstracted geometry based on retained layout evidence -->
  <g opacity="0.96">
    <rect x="102" y="230" width="628" height="16" fill="#16a34a"/>
    <rect x="102" y="420" width="628" height="16" fill="#16a34a"/>
    <rect x="124" y="258" width="580" height="22" fill="#7c3aed"/>
    <rect x="124" y="374" width="580" height="22" fill="#7c3aed"/>
    <rect x="146" y="286" width="82" height="70" fill="#be123c" opacity="0.78"/>
    <rect x="252" y="286" width="82" height="70" fill="#be123c" opacity="0.78"/>
    <rect x="358" y="286" width="82" height="70" fill="#be123c" opacity="0.78"/>
    <rect x="464" y="286" width="82" height="70" fill="#be123c" opacity="0.78"/>
    <rect x="570" y="286" width="82" height="70" fill="#be123c" opacity="0.78"/>
    <g fill="#06b6d4">
      <rect x="166" y="254" width="16" height="146"/>
      <rect x="272" y="254" width="16" height="146"/>
      <rect x="378" y="254" width="16" height="146"/>
      <rect x="484" y="254" width="16" height="146"/>
      <rect x="590" y="254" width="16" height="146"/>
    </g>
    <g fill="#f59e0b">
      <rect x="135" y="302" width="558" height="10"/>
      <rect x="135" y="342" width="558" height="10"/>
      <rect x="198" y="246" width="10" height="190"/>
      <rect x="516" y="246" width="10" height="190"/>
    </g>
    <g fill="#e2e8f0">
      <circle cx="174" cy="307" r="5"/><circle cx="280" cy="307" r="5"/>
      <circle cx="386" cy="307" r="5"/><circle cx="492" cy="307" r="5"/>
      <circle cx="598" cy="307" r="5"/><circle cx="174" cy="347" r="5"/>
      <circle cx="280" cy="347" r="5"/><circle cx="386" cy="347" r="5"/>
      <circle cx="492" cy="347" r="5"/><circle cx="598" cy="347" r="5"/>
    </g>
  </g>
  <text x="92" y="226" class="darkLabel">VDD</text>
  <text x="92" y="449" class="darkLabel">VSS</text>
  <text x="110" y="475" class="small">Functional cell geometry reconstructed from the retained Virtuoso layout view.</text>

  <!-- Panel B: LVS -->
  <g filter="url(#shadow)">
    <rect x="820" y="120" width="730" height="380" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="820" y="120" width="730" height="6" rx="3" fill="#0f766e"/>
  </g>
  <circle cx="856" cy="163" r="16" fill="#0f766e"/>
  <text x="856" y="168" text-anchor="middle" class="panelNo">B</text>
  <text x="886" y="160" class="panelTitle">Calibre LVS verification</text>
  <text x="886" y="182" class="panelSub">Layout-versus-schematic comparison of the extracted cell</text>
  <rect x="848" y="210" width="674" height="92" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <circle cx="900" cy="256" r="25" fill="#059669"/>
  <path d="M888 256l8 8 17-19" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="944" y="251" class="status">CORRECT</text>
  <text x="944" y="277" class="small">Schematic and extracted layout are topologically equivalent.</text>
  <line x1="848" y1="332" x2="1522" y2="332" stroke="#e2e8f0"/>
  <text x="872" y="362" class="label">Comparison stage</text>
  <text x="1498" y="362" text-anchor="end" class="value">LVS</text>
  <text x="872" y="397" class="label">Result</text>
  <text x="1498" y="397" text-anchor="end" class="pass">CLEAN MATCH</text>
  <text x="872" y="432" class="label">Evidence retained</text>
  <text x="1498" y="432" text-anchor="end" class="value">Calibre transcript + layout view</text>
  <rect x="848" y="458" width="674" height="24" rx="4" fill="#f1f5f9"/>
  <text x="1185" y="475" text-anchor="middle" class="small">Cell-level verification precedes full-chip place-and-route integration.</text>

  <!-- Panel C: timing -->
  <g filter="url(#shadow)">
    <rect x="50" y="540" width="730" height="390" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="50" y="540" width="730" height="6" rx="3" fill="#7c3aed"/>
  </g>
  <circle cx="86" cy="583" r="16" fill="#7c3aed"/>
  <text x="86" y="588" text-anchor="middle" class="panelNo">C</text>
  <text x="116" y="580" class="panelTitle">PEX HSPICE timing</text>
  <text x="116" y="602" class="panelSub">Single-condition extracted simulation at 25 °C</text>

  <g>
    <rect x="78" y="630" width="334" height="252" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="100" y="661" class="label">MEASUREMENT</text>
    <text x="390" y="661" text-anchor="end" class="label">RESULT</text>
    <line x1="96" y1="676" x2="394" y2="676" stroke="#cbd5e1"/>
    <text x="100" y="707" class="mono">clk→Q rise</text>
    <text x="390" y="707" text-anchor="end" class="value">135.21 ps</text>
    <text x="100" y="744" class="mono">clk→Q fall</text>
    <text x="390" y="744" text-anchor="end" class="value">163.40 ps</text>
    <text x="100" y="781" class="mono">clk→Q worst</text>
    <text x="390" y="781" text-anchor="end" class="value">163.40 ps</text>
    <text x="100" y="818" class="mono">Q rise slew</text>
    <text x="390" y="818" text-anchor="end" class="value">56.76 ps</text>
    <text x="100" y="855" class="mono">Q fall slew</text>
    <text x="390" y="855" text-anchor="end" class="value">59.96 ps</text>
  </g>
  <g>
    <rect x="438" y="630" width="314" height="252" rx="7" fill="#07111f"/>
    <line x1="460" y1="688" x2="730" y2="688" stroke="#334155"/>
    <line x1="460" y1="756" x2="730" y2="756" stroke="#334155"/>
    <line x1="460" y1="824" x2="730" y2="824" stroke="#334155"/>
    <text x="460" y="653" class="darkLabel">EXTRACTED WAVEFORMS</text>
    <text x="460" y="680" class="darkLabel">CLK</text>
    <path d="M500 676H540V642H586V676H632V642H678V676H722" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="460" y="748" class="darkLabel">D</text>
    <path d="M500 744H560V710H650V744H722" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <text x="460" y="816" class="darkLabel">Q</text>
    <path d="M500 812H596V778H692V812H722" fill="none" stroke="#34d399" stroke-width="3"/>
    <line x1="586" y1="636" x2="586" y2="842" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="596" y1="772" x2="596" y2="842" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M586 850H596" stroke="#a78bfa" stroke-width="2"/>
    <text x="591" y="869" text-anchor="middle" class="darkLabel">tCQ</text>
  </g>
  <text x="78" y="908" class="small">Educational characterization result; not a multi-corner Liberty signoff model.</text>

  <!-- Panel D: setup sweep -->
  <g filter="url(#shadow)">
    <rect x="820" y="540" width="730" height="390" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="820" y="540" width="730" height="6" rx="3" fill="#ea580c"/>
  </g>
  <circle cx="856" cy="583" r="16" fill="#ea580c"/>
  <text x="856" y="588" text-anchor="middle" class="panelNo">D</text>
  <text x="886" y="580" class="panelTitle">Parametric setup-time sweep</text>
  <text x="886" y="602" class="panelSub">Observed pass/fail boundary at the retained 10 ps sweep resolution</text>

  <rect x="848" y="632" width="674" height="82" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="880" y="662" class="label">Sweep outcome</text>
  <text x="880" y="692" class="mono">20 ps</text>
  <rect x="952" y="678" width="180" height="18" rx="9" fill="#10b981"/>
  <text x="1148" y="692" class="pass">PASS</text>
  <text x="1260" y="692" class="mono">10 ps</text>
  <rect x="1332" y="678" width="92" height="18" rx="9" fill="#ef4444"/>
  <text x="1440" y="692" class="fail">FAIL</text>

  <text x="848" y="756" class="label">OBSERVED SETUP BOUNDARY</text>
  <line x1="890" y1="820" x2="1480" y2="820" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="890" y1="810" x2="890" y2="830" stroke="#64748b" stroke-width="2"/>
  <line x1="1185" y1="810" x2="1185" y2="830" stroke="#64748b" stroke-width="2"/>
  <line x1="1480" y1="810" x2="1480" y2="830" stroke="#64748b" stroke-width="2"/>
  <text x="890" y="854" text-anchor="middle" class="mono">0 ps</text>
  <text x="1185" y="854" text-anchor="middle" class="mono">10 ps</text>
  <text x="1480" y="854" text-anchor="middle" class="mono">20 ps</text>
  <circle cx="890" cy="820" r="11" fill="#ef4444"/>
  <path d="M884 814l12 12m0-12l-12 12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1185" cy="820" r="11" fill="#ef4444"/>
  <path d="M1179 814l12 12m0-12l-12 12" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1480" cy="820" r="11" fill="#10b981"/>
  <path d="M1474 820l4 4 9-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="848" y="881" width="674" height="30" rx="5" fill="#fff7ed"/>
  <text x="1185" y="901" text-anchor="middle" class="small">Result: the transition lies between 10 ps and 20 ps at this test condition.</text>
</svg>
