name: RTL simulation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  iverilog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog

      - name: Run self-checking testbench
        run: make sim
