name: Materialize DFF evidence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace reconstruction with retained CAD evidence
        if: ${{ hashFiles('docs/images/dff-cell-characterization.jpg.b64') != '' }}
        shell: bash
        run: |
          base64 --decode docs/images/dff-cell-characterization.jpg.b64 > docs/images/dff-cell-characterization.jpg
          base64 --decode docs/physical-design.md.b64 > docs/physical-design.md
          git rm docs/images/dff-cell-characterization.jpg.b64
          git rm docs/physical-design.md.b64
          git rm docs/images/dff-cell-characterization.svg
          git rm .github/workflows/materialize-dff-evidence.yml
          git add docs/images/dff-cell-characterization.jpg docs/physical-design.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace DFF reconstruction with retained CAD evidence"
          git push
